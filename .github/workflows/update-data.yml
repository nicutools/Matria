name: Monthly Data Update

on:
  schedule:
    # 1st of each month at 3am UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'Optional: paste a TGA CSV URL to skip auto-discovery'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the data update, so a regression in the date logic fails
      # here rather than publishing a dataset with a wrong currency date.
      - name: Test date logic
        run: npm test

      # The TGA's Akamai front end resets every non-browser and every headless
      # client, from runners and home connections alike, but lets a headed
      # browser through. So the update runs a real Chromium on a virtual
      # display. Probed from this runner image in October 2026.
      - name: Install Chromium for the TGA download
        run: npx playwright install --with-deps chromium

      - name: Update TGA pregnancy data
        id: tga
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.csv_url }}" ]; then
            xvfb-run -a node scripts/convert-tga-csv.js --browser --url "${{ github.event.inputs.csv_url }}"
          else
            xvfb-run -a node scripts/convert-tga-csv.js --browser
          fi

      # BUMPS/MotherToBaby are a cosmetic link list. Without continue-on-error
      # an outage on either site aborts the job AFTER the TGA step succeeded,
      # so freshly downloaded pregnancy-safety data never gets committed or
      # deployed — and no issue is opened, because the TGA step didn't fail.
      # A link list must never be able to veto a TGA data update.
      - name: Update external links (BUMPS + MotherToBaby)
        id: links
        continue-on-error: true
        run: node scripts/validate-external-links.js

      # _meta.checked advances on every successful TGA fetch, so this is now
      # effectively "did the TGA step succeed", and a month where the data is
      # byte-identical still rebuilds and deploys. That is deliberate: a
      # synced-on date the user can see is only honest if the deployed bundle
      # actually carries it. If the TGA step failed, the data file is untouched
      # and nothing here advances.
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changes detected:"
            git diff --stat
          fi

      - name: Bump SW cache version
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Extract current version number and increment
          CURRENT=$(grep -oP "const CACHE_VERSION = 'v\K[0-9]+" public/sw.js)
          NEXT=$((CURRENT + 1))
          sed -i "s/const CACHE_VERSION = 'v${CURRENT}'/const CACHE_VERSION = 'v${NEXT}'/" public/sw.js
          echo "Bumped CACHE_VERSION: v${CURRENT} → v${NEXT}"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build commit message based on what succeeded
          if [ "${{ steps.tga.outcome }}" = "success" ]; then
            MSG="chore: monthly data update (TGA + external links)"
          else
            MSG="chore: monthly data update (external links only — TGA update failed)"
          fi

          git add src/data/tgaPregnancy.json scripts/tga-config.json src/data/bumpsLinks.json src/data/motherToBabyLinks.json public/sw.js
          git commit -m "$MSG" || echo "Nothing to commit"
          git push

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true'
        run: npx wrangler pages deploy dist --project-name matria
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create GitHub Issue on TGA failure
        if: always() && steps.tga.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One open issue at a time, but every failure is recorded on it.
          # Skipping silently here let issue #1 sit open from May while the
          # TGA step kept failing, so a repeat failure looked exactly like no
          # failure at all. A comment sends a notification; a skip does not.
          EXISTING=$(gh issue list --label "tga-update-failed" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            LAST_SYNCED=$(jq -r '.lastChecked // "unknown"' scripts/tga-config.json)
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%Y-%m-%d) ([run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). The app is still serving TGA data last synced on ${LAST_SYNCED}."
            echo "Commented on open issue #$EXISTING."
            exit 0
          fi

          # Ensure the label exists
          gh label create "tga-update-failed" --color "d93f0b" --description "Automated TGA data update failed" --force

          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            LINKS_STATUS="Yes — external links were updated and deployed successfully."
          else
            LINKS_STATUS="No changes were needed."
          fi

          gh issue create \
            --title "Monthly update: TGA data couldn't be refreshed" \
            --label "tga-update-failed" \
            --body "## What happened

          The automated monthly check tried to download the latest pregnancy safety data from the TGA (Therapeutic Goods Administration) website, but couldn't reach it. This has happened before — the TGA website is sometimes slow or blocks automated requests.

          ## Did anything else update?

          ${LINKS_STATUS}

          ## What does this mean?

          **The app is still working fine.** It's just using the previous month's TGA data, which is almost certainly still current — the TGA only updates this data a few times per year.

          ## How to fix it

          1. **Visit the TGA page:** [Prescribing Medicines in Pregnancy Database](https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database)
          2. **Find the CSV download link** on that page (it's usually a link ending in .csv)
          3. **Copy the link address** (right-click the link, then Copy link address)
          4. **Re-run the workflow with the URL:**
             - Go to [Run Workflow](https://github.com/nicutools/Matria/actions/workflows/update-data.yml)
             - Click the **Run workflow** button
             - Paste the CSV URL into the text field
             - Click the green **Run workflow** button

          ## If the TGA page looks different or broken

          The TGA occasionally restructures their website. If the page above doesn't have a CSV download link anymore, the discovery script may need updating. Open a separate issue or ask Claude Code for help."

      - name: Warn if external links couldn't be refreshed
        if: always() && steps.links.outcome == 'failure'
        run: |
          echo "::warning::BUMPS/MotherToBaby link refresh failed. The existing link"
          echo "::warning::lists were kept and the TGA update was NOT blocked."
          echo "::warning::These lists change rarely; no action is usually needed."
